<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for minimal social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Clean Minimalist Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <!-- Banner Image Container -->
        <div class="banner-container">
            <!-- Save your laptop photo as banner.jpg in your repo -->
            <img src="banner.jpg" alt="Banner Image" class="banner-img">
            <div class="banner-overlay"></div>
        </div>

        <!-- Profile / Info Content -->
        <div class="content">
            <h1 class="name">Your Name</h1>
            <p class="tagline">Creator & Developer</p>
            <p class="bio">Simple, minimal space connecting all my social platforms and projects.</p>

            <!-- Links Section -->
            <div class="links-grid">
                <a href="https://www.linkedin.com/in/YOUR_USERNAME" target="_blank" class="link-btn">
                    <i class="fa-brands fa-linkedin-in"></i>
                    <span>LinkedIn</span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

                <a href="https://www.facebook.com/YOUR_USERNAME" target="_blank" class="link-btn">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

                <a href="https://www.instagram.com/YOUR_USERNAME" target="_blank" class="link-btn">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

                <a href="https://www.youtube.com/@YOUR_CHANNEL" target="_blank" class="link-btn">
                    <i class="fa-brands fa-youtube"></i>
                    <span>YouTube</span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
            </div>

            <footer>
                © <script>document.write(new Date().getFullYear())</script> • All rights reserved.
            </footer>
        </div>
    </div>

</body>
</html>
